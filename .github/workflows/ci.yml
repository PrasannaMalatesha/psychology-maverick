# CI quality gate (M7). Every push/PR to dev, main, prod must pass both jobs.
name: CI

on:
  push:
    branches: [dev, main, prod]
  pull_request:
    branches: [dev, main, prod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, types, boundaries, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      # Tests run against a real pgvector Postgres via testcontainers (Docker is on the runner).
      - run: uv run pytest

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pip-audit (locked deps, all extras)
        working-directory: backend
        run: |
          uv export --frozen --all-extras --no-emit-project --no-hashes -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit -r "$RUNNER_TEMP/req.txt" --disable-pip --no-deps
      - name: gitleaks (git history)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1 git /repo --redact -v
      - name: Trivy (filesystem, HIGH/CRITICAL)
        run: >
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.74.0
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /repo
